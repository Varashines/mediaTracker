[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediatracker-mcp"
version = "0.1.0"
description = "MCP server for the MediaTracker app — read-only library search and insights"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.6",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["schema", "server"]
