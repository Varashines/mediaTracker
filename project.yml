name: MediaTracker
options:
  bundleIdPrefix: com.vara
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGN_STYLE: Automatic

targets:
  MediaTracker:
    type: application
    platform: macOS
    sources:
      - path: Sources/MediaTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vara.mediatracker
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        MARKETING_VERSION: "8.1.1"
        CURRENT_PROJECT_VERSION: "2"
  MediaTrackerDev:
    type: application
    platform: macOS
    sources:
      - path: Sources/MediaTracker
    settings:
      base:
        PRODUCT_NAME: "MediaTracker Dev"
        PRODUCT_BUNDLE_IDENTIFIER: com.vara.mediatracker.dev
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "MediaTracker Dev"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        MARKETING_VERSION: "8.1.1"
        CURRENT_PROJECT_VERSION: "2"
