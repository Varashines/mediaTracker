name: Build and Release DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            runner_arch: arm64
            output_label: "Apple Silicon"
          - arch: x86_64
            runner_arch: x86_64
            output_label: "Intel"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6.0'

      # ✅ 1. Swift PM Build Cache Integration
      - name: Cache Swift PM Build Directory
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ matrix.arch }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.arch }}-

      # Sign with the same identity as local development instead of ad-hoc.
      #
      # Ad-hoc signing (`--sign -`) derives the app's designated requirement from the binary's
      # cdhash, so every release looks like a different app to the Keychain: a user who updates from
      # a DMG is asked to approve access to their stored API keys and sync key again after every
      # update. A certificate makes that requirement `identifier + certificate`, stable across
      # releases. It is self-signed, so it is an identity, not a trust anchor — Gatekeeper behaves
      # exactly as it did with the ad-hoc builds.
      #
      # Secrets: CERT_P12_BASE64 (the exported .p12, base64) and CERT_PASSWORD. Without them — a
      # fork, or a repo where they were never added — the pipeline falls back to ad-hoc and says so.
      - name: Import signing identity
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::warning::CERT_P12_BASE64 is not configured; signing ad-hoc (Keychain will prompt on updates)."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"

          # codesign cannot reach the key without this on a headless runner; it would sit on a
          # keychain-access dialog that nobody can click.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          IDENTITY="MediaTracker Local Signing"
          # Deliberately not `find-identity -p codesigning`: that filters by policy, and a
          # self-signed certificate on a fresh runner is not trusted (trust settings are not part
          # of a .p12). Trust is not required to *sign* — codesign accepts an untrusted identity —
          # so this checks the certificate reached the keychain, and the packaging step verifies
          # the signature it actually produced.
          if ! security find-certificate -a -c "$IDENTITY" "$KEYCHAIN" >/dev/null 2>&1; then
            echo "::error::Signing identity '$IDENTITY' is missing after import. Check CERT_P12_BASE64 and CERT_PASSWORD."
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # ✅ 2. Application Bundle Compilation
      - name: Build App Bundle
        run: |
          chmod +x install.sh
          
          APP_NAME="MediaTracker"
          BUNDLE_ID="com.vara.mediatracker"
          EXECUTABLE_NAME="MediaTracker"
          ARCH="${{ matrix.arch }}"
          
          echo "🚀 Building $APP_NAME for $ARCH..."
          swift build -c release --arch $ARCH
          
          echo "🎨 Generating App Icon..."
          swift generate_icon.swift
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
          
          echo "📦 Packaging into $APP_NAME.app..."
          APP_BUNDLE="$APP_NAME.app"
          CONTENTS_DIR="$APP_BUNDLE/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"
          
          mkdir -p "$MACOS_DIR"
          mkdir -p "$RESOURCES_DIR"
          
          cp ".build/${ARCH}-apple-macosx/release/$EXECUTABLE_NAME" "$MACOS_DIR/"
          cp AppIcon.icns "$RESOURCES_DIR/"
          
          cat > "$CONTENTS_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$EXECUTABLE_NAME</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>$BUNDLE_ID</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>LSMinimumSystemVersion</key>
              <string>15.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # A bundle must carry a signature to launch; prefer the imported identity so updates do
          # not invalidate the Keychain ACL, and fall back to ad-hoc when none was configured.
          codesign --force --sign "${SIGN_IDENTITY:--}" "$APP_BUNDLE"

          # Never let a configured identity quietly degrade to ad-hoc: that is the failure that
          # makes the Keychain prompt on every update, and it would only surface on a user's Mac.
          if [ "$SIGN_IDENTITY" != "-" ]; then
            if ! codesign -dv --verbose=2 "$APP_BUNDLE" 2>&1 | grep -q "Authority=$SIGN_IDENTITY"; then
              echo "::error::$APP_BUNDLE was not signed by $SIGN_IDENTITY"
              exit 1
            fi
          fi

      # ✅ 3. Install create-dmg CLI via native Homebrew
      - name: Install create-dmg utility
        run: brew install create-dmg

      # ✅ 4. Package Styled Installation Window Disk Image
      # Layout parameters place the App Icon on the left and Applications link on the right
      - name: Create Styled DMG
        id: create_dmg
        run: |
          ARCH="${{ matrix.arch }}"
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="MediaTracker-${VERSION}-${ARCH}"
          echo "dmg_file=${DMG_NAME}.dmg" >> "$GITHUB_OUTPUT"

          create-dmg \
            --volname "MediaTracker Installation" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "MediaTracker.app" 175 190 \
            --hide-extension "MediaTracker.app" \
            --app-drop-link 425 190 \
            "${DMG_NAME}.dmg" \
            "MediaTracker.app"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaTracker-${{ matrix.arch }}
          path: ${{ steps.create_dmg.outputs.dmg_file }}
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all DMGs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
