name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6.0'

      - name: Cache Swift PM Build Directory
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-ci-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-ci-

      - name: Build
        run: swift build

      # The FULL suite is the gate. It used to be a hand-maintained list of 22 suite
      # names, of which two (`ModelTests`, `UtilityTests`) matched no class at all —
      # those are file names, not class names — so 43 of 63 classes never gated a
      # merge, including every data-integrity suite (Persistence, CloudSync, Predicate,
      # StoreLocation, LedgerDedup, HealPredicate).
      #
      # The old `continue-on-error` diagnostic is gone: with container pinning in
      # MediaItem's deferred tasks and the MTTestCase teardown hook, a full run of all
      # 517 tests completes on macOS 27 / Xcode 27.2 and on macos-latest. If the
      # teardown crash returns, fix it rather than re-hiding the suite.
      #
      # There are no skips. Two CloudSyncScenario tests used to be excluded because they
      # depended on a `cloudSyncLastTimestamp` left behind by an earlier run; they now
      # declare their own sync state (`setWatermark`), so they pass from a clean defaults
      # domain. See AUDIT-2026-10-25.md §11.3.
      - name: Test (full suite)
        run: swift test
