name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6.0'

      - name: Cache Swift PM Build Directory
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-ci-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-ci-

      - name: Build
        run: swift build

      - name: Test stable suites
        run: |
          suites=(
            BadgeEngineTests
            BingeLogicTests
            DateUtilsTests
            DetailViewModelTests
            EpisodeRangeTests
            FilterAndSortTests
            ImportSeasonTasteTests
            MarkWatchedTests
            ModelTests
            NetworkingTests
            ProgressCalculationTests
            RuntimeFallbackTests
            SeasonTasteTests
            StateTransitionTests
            SyncCachedPropertiesTests
            UtilityTests
            WatchProvidersTests
            WeeklyDigestTests
            YearInReviewTests
          )
          for suite in "${suites[@]}"; do
            swift test --filter "$suite"
          done

      - name: Test full suite (SwiftData teardown diagnostic)
        # NOTE: SwiftData in-memory teardown race can still crash full-suite post-assertions
        # even with SaveCoordinator.cancelAll() swizzle (Tests/Support/TestTeardown.swift).
        # Stable suites above are the hard gate; keep this diagnostic visible until
        # the framework-level container teardown race is fully eliminated.
        continue-on-error: true
        run: swift test
